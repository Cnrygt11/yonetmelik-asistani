# Varsayılan ayarlar. Değerler proje planındaki kararlardan gelir (bölüm 5 ve 7).
# Yerel değişiklikler için configs/local.yaml oluşturun (Git dışındadır);
# yalnızca değiştirmek istediğiniz anahtarları yazmanız yeterli.

corpus_version: "2026.10.2"   # derlem v1.1: P1 + 2547 geçici md. 85 (12.10.2026)

chunking:                  # plan 6.4
  short_madde_tokens: 350  # bu boyutun altındaki maddeler bölünmez
  max_tokens: 450          # daha uzun fıkralar bent gruplarına bölünür

llm:
  backend: ollama          # ollama (yerel API) | openai (llama.cpp, vLLM vb. OpenAI uyumlu sunucular)
  base_url: http://localhost:11434
  model: qwen3.5:27b-q4_K_M  # K-16: L4 (24 GB) gerekir; 9B'ye göre sabit 40 soruda %50,0 → %64,7 (FAZ_4.md)
  fallback_model: qwen3.5:9b # T4 (16 GB) yedeği (K-01); notebook GPU belleğine göre seçer
  temperature: 0.1
  seed: 42
  num_ctx: 8192            # Ollama varsayılanı küçük olabilir; açıkça ayarlanır
  think: false             # RAG'de düşünme modu kapalı
  max_tokens: 700
  timeout_s: 180
  keep_alive: -1           # modeli bellekte tut; yoksa 5 dk boşta kalınca ilk soru ~2 dk bekler

embedding:                 # Faz 2
  model: BAAI/bge-m3
  dtype: float16           # T4 bf16 desteklemez
  batch_size: 16

reranker:                  # Faz 2
  model: BAAI/bge-reranker-v2-m3
  dtype: float16
  batch_size: 8            # bellek yetmezse kendiliğinden yarıya iner
  top_n: 6
  reject_threshold: null   # Faz 4'te altın setle kalibre edilecek

retrieval:                 # Faz 2
  bm25:
    k1: 1.2
    b: 0.75
    candidates: 30
    tokenizer: char        # K-13: 3-5 karakter n-gram; 134 soruluk geliştirme setinde F5'ten iyi (FAZ_3.md)
  low_priority_factor: 0.8 # "Yürürlük", "Yürütme" maddelerinin skoru bu oranla düşürülür
  turkce_karakter: true    # Türkçe karaktersiz soruyu BGE-M3 ve reranker için belgelerin yazımına çevir
  dense:
    candidates: 30
  rrf_k: 60
  glossary: true           # K-12: öğrenci dili sözlüğüyle sorgu genişletme (data/glossary.yaml)
  context_token_budget: 5000

generation:                # Faz 4 bağlam derleme
  rel_rerank: 0.1          # reranker skoru en iyi kaynağın %10'unun altındaki kaynaklar atılır
  max_sources: 5           # bağlamdaki en çok kaynak; Adım 1 taraması (FAZ_4.md)
  ilgili_maddeler: configs/ilgili_maddeler.yaml  # bağlantılı maddeler; boş bırakılırsa kapalı
  dogrulama: true          # cevap cümleleri ikinci model çağrısıyla bağlama karşı denetlenir (istem v4)
  takip: true              # arayüzde takip sorusu son iki soruya bakılarak yeniden yazılır

paths:
  # Colab'da YA_DATA_DIR ortam değişkeni Drive'daki dizini gösterir.
  data_dir: data
  manifest: configs/corpus_manifest.yaml
  glossary: data/glossary.yaml

logging:
  retention_days: 180      # en fazla bir dönem (bölüm 11.1)
