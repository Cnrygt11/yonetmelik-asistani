# Varsayılan ayarlar. Değerler proje planındaki kararlardan gelir (bölüm 5 ve 7).
# Yerel değişiklikler için configs/local.yaml oluşturun (Git dışındadır);
# yalnızca değiştirmek istediğiniz anahtarları yazmanız yeterli.

corpus_version: "2026.10.1"   # derlem v1: P1 belgeler, Faz 1'de doğrulandı (12.10.2026)

chunking:                  # plan 6.4
  short_madde_tokens: 350  # bu boyutun altındaki maddeler bölünmez
  max_tokens: 450          # daha uzun fıkralar bent gruplarına bölünür

llm:
  backend: ollama          # ollama (yerel API) | openai (llama.cpp, vLLM vb. OpenAI uyumlu sunucular)
  base_url: http://localhost:11434
  model: qwen3.5:9b        # K-01; etiket kurulumda ollama.com/library üzerinden doğrulanacak
  fallback_model: gemma4:e4b
  temperature: 0.1
  seed: 42
  num_ctx: 8192            # Ollama varsayılanı küçük olabilir; açıkça ayarlanır
  think: false             # RAG'de düşünme modu kapalı
  max_tokens: 700
  timeout_s: 180
  keep_alive: -1           # modeli bellekte tut; yoksa 5 dk boşta kalınca ilk soru ~2 dk bekler

embedding:                 # Faz 2
  model: BAAI/bge-m3
  dtype: float16           # T4 bf16 desteklemez
  batch_size: 16

reranker:                  # Faz 2
  model: BAAI/bge-reranker-v2-m3
  dtype: float16
  top_n: 6
  reject_threshold: null   # Faz 4'te altın setle kalibre edilecek

retrieval:                 # Faz 2
  bm25:
    k1: 1.2
    b: 0.75
    candidates: 30
    tokenizer: prefix5     # K-10: ilk 5 harf; Snowball ve karakter n-gram'dan iyi ölçüldü (FAZ_2.md)
  low_priority_factor: 0.8 # "Yürürlük", "Yürütme" maddelerinin skoru bu oranla düşürülür
  dense:
    candidates: 30
  rrf_k: 60
  context_token_budget: 5000

paths:
  # Colab'da YA_DATA_DIR ortam değişkeni Drive'daki dizini gösterir.
  data_dir: data
  manifest: configs/corpus_manifest.yaml
  glossary: data/glossary.yaml

logging:
  retention_days: 180      # en fazla bir dönem (bölüm 11.1)
