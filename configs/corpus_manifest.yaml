# Derlem manifesti (plan bölüm 5.2 ve 6). Manifest'te olmayan hiçbir dosya indekslenmez.
#
# DURUM: TASLAK. Kayıtlar ön araştırmadan geldi; hiçbiri henüz doğrulanmadı.
# Faz 1'de her kayıt KAYSİS / Resmî Gazete ile karşılaştırılıp
# dogrulayan + dogrulama_tarihi doldurulacak, kaynak adresleri ve sha256 eklenecek.
#
# Alanlar:
#   id               : kalıcı kimlik (parça kimliklerinin ön eki olur)
#   baslik           : resmî tam ad
#   tur              : kanun | yok_yonetmeligi | kurum_yonetmeligi | senato_yonergesi | birim_yonergesi | duyuru
#   hiyerarsi        : 1 kanun … 6 duyuru/takvim (plan 6.1)
#   birim            : [tum] veya birim kimlikleri
#   duzey            : onlisans | lisans | lisansustu | hazirlik
#   oncelik          : P1 | P2 | P3
#   yayim            : ilk yayım {tarih, rg_sayi}
#   degisiklikler    : tarih sırasıyla değişiklik metinleri {tarih, rg_sayi}
#   durum            : yururlukte | kaldirildi | arsiv
#   kaynaklar        : tercih sırasıyla adresler (önce Resmî Gazete HTML, sonra KAYSİS/mevzuat.gov.tr, en son PDF)
#   sha256           : indirilen dosyanın özeti (Faz 1'de doldurulur)
#   dogrulayan, dogrulama_tarihi, notlar

