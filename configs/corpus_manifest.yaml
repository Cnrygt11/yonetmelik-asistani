# Derlem manifesti (plan bölüm 5.2 ve 6). Manifest'te olmayan hiçbir dosya indekslenmez.
#
# Kaynak politikası (karar K-09): işlenmiş (konsolide) metin KAYSİS'ten alınır.
# Resmî Gazete yalnızca güncellik kontrolüne girdi verir: PDF'in sonundaki "Yayımlandığı Resmî
# Gazete" tablosu, aşağıdaki yayim/degisiklikler alanlarıyla otomatik karşılaştırılır
# (python -m yonetmelik_asistani.ingest extract).
#
# İndirilen dosyaların özeti ve tarihi configs/corpus_lock.json'dadır (betik yazar).
# KAYSİS listesi: https://kms.kaysis.gov.tr/Home/Kurum/92662996  (kaynaklar.id = Goster kimliği)
#
# Alanlar:
#   id          kalıcı kimlik (parça kimliklerinin ön eki)
#   tur         kanun | yok_yonetmeligi | kurum_yonetmeligi | senato_yonergesi | birim_yonergesi | usul_esas
#   hiyerarsi   1 kanun … 6 duyuru/takvim (plan 6.1)
#   birim       [tum] veya birim kimlikleri
#   duzey       onlisans | lisans | lisansustu | hazirlik
#   oncelik     P1 (MVP) | P2 (v1.0) | P3 (v2)
#   durum       yururlukte | kaldirildi | arsiv | inceleme (yürürlüğü teyit edilmeden indekslenmez)
#   yayim, degisiklikler   {tarih, rg_sayi}; yalnızca Resmî Gazete'de yayımlananlar için

