[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "yonetmelik-asistani"
version = "0.0.1"
description = "Bursa Uludağ Üniversitesi öğrenci mevzuatı için açık kaynaklı RAG asistanı"
readme = "README.md"
requires-python = ">=3.11"
# Faz 0 yalnızca yapılandırma ve LLM istemcisini içerir.
# Diğer bağımlılıklar ilgili fazda ekstra grup olarak eklenecek (ingest, index, ui).
dependencies = [
  "certifi",            # KAYSİS için ara sertifikayla birleştirilen kök sertifikalar
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ingest = [            # Faz 1: belge edinme ve metin çıkarma
  "pymupdf>=1.24",
]
search = [            # Faz 2: sözcüksel arama (CPU)
  "bm25s>=0.2",
  "snowballstemmer>=2.2",  # Snowball Türkçe kök bulucu, saf Python
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
ya-smoke = "yonetmelik_asistani.smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yonetmelik_asistani"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]  # ince Colab çalıştırıcısı; IPython komutları içerir
